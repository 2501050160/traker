<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serial Monitor - Smart Drive Mate</title>
    <link rel="stylesheet" href="transport-styles.css">
    <link rel="stylesheet" href="controller-styles.css">
    <style>
        .serial-page-container {
            width: 100%;
            min-height: 100vh;
            padding: 1rem;
        }

        .serial-page-grid {
            display: grid;
            grid-template-columns: minmax(320px, 860px);
            justify-content: center;
        }

        .serial-monitor {
            min-height: 420px;
            max-height: 65vh;
        }
    </style>
</head>
<body>
    <div class="serial-page-container">
        <header class="controller-header">
            <div class="header-content">
                <h1>📟 Serial Monitor</h1>
                <p class="subtitle">Arduino + HC-05 live serial readings</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-warning" onclick="window.location.href='vehicle-controller.html'">🎮 Controller Page</button>
            </div>
        </header>

        <div class="serial-page-grid">
            <div class="panel-section">
                <h2>Serial Monitor</h2>
                <div class="serial-controls">
                    <div class="form-group">
                        <label for="baudRateInput">Baud Rate</label>
                        <input type="number" id="baudRateInput" value="9600" min="300" step="300">
                    </div>
                    <div class="serial-actions">
                        <button class="control-btn" id="selectPortBtn" style="background: #2563eb;">🔌 Select Port</button>
                        <button class="control-btn" id="connectSerialBtn" style="background: #10b981;">▶ Connect</button>
                        <button class="control-btn" id="disconnectSerialBtn" style="background: #ef4444;">⏹ Disconnect</button>
                    </div>
                    <div class="serial-send-actions">
                        <button class="control-btn serial-send-btn" id="sendCmd1Btn" data-cmd="1">1</button>
                        <button class="control-btn serial-send-btn" id="sendCmd2Btn" data-cmd="2">2</button>
                        <button class="control-btn serial-send-btn" id="sendCmd3Btn" data-cmd="3">3</button>
                        <button class="control-btn serial-send-btn" id="sendCmd4Btn" data-cmd="4">4</button>
                    </div>
                    <div class="serial-status" id="serialStatus">Status: Disconnected</div>
                    <div class="serial-monitor" id="serialMonitorOutput" aria-live="polite">Waiting for serial data...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const auth = sessionStorage.getItem('auth');
            if (!auth) {
                window.location.href = 'login.html?target=controller';
                return;
            }

            try {
                const authData = JSON.parse(auth);
                if (authData.role !== 'admin') {
                    alert('Access denied! Serial Monitor is only available for administrators.');
                    window.location.href = 'transport-dashboard.html';
                }
            } catch (_) {
                window.location.href = 'login.html?target=controller';
            }
        })();

        const serialState = {
            port: null,
            reader: null,
            readLoopActive: false,
            buffer: ''
        };

        function updateStatus(message) {
            const el = document.getElementById('serialStatus');
            if (el) el.textContent = message;
        }

        function appendOutput(text) {
            const outputEl = document.getElementById('serialMonitorOutput');
            if (!outputEl) return;

            if (outputEl.textContent.trim() === 'Waiting for serial data...') {
                outputEl.textContent = '';
            }

            const ts = new Date().toLocaleTimeString();
            outputEl.textContent += `[${ts}] ${text}\n`;
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        async function selectPort() {
            if (!('serial' in navigator)) {
                updateStatus('Web Serial not supported in this browser');
                appendOutput('[ERROR] Use Chrome or Edge for serial support.');
                return;
            }

            try {
                serialState.port = await navigator.serial.requestPort();
                updateStatus('Status: Port selected');
                appendOutput('[INFO] Serial port selected.');
            } catch (error) {
                if (error && error.name !== 'NotFoundError') {
                    appendOutput(`[ERROR] Port selection failed: ${error.message}`);
                }
            }
        }

        async function connectSerial() {
            if (!serialState.port) {
                appendOutput('[WARN] Select a serial port first.');
                return;
            }

            const baud = parseInt(document.getElementById('baudRateInput').value, 10) || 9600;
            try {
                await serialState.port.open({ baudRate: baud });
                serialState.readLoopActive = true;
                updateStatus(`Status: Connected (${baud} baud)`);
                appendOutput(`[INFO] Connected at ${baud} baud.`);
                readLoop();
            } catch (error) {
                updateStatus('Status: Connection failed');
                appendOutput(`[ERROR] Connection failed: ${error.message}`);
            }
        }

        async function readLoop() {
            if (!serialState.port || !serialState.port.readable) return;

            try {
                serialState.reader = serialState.port.readable.getReader();
                const decoder = new TextDecoder();

                while (serialState.readLoopActive) {
                    const { value, done } = await serialState.reader.read();
                    if (done) break;
                    if (!value) continue;

                    serialState.buffer += decoder.decode(value, { stream: true });
                    const lines = serialState.buffer.split(/\r?\n/);
                    serialState.buffer = lines.pop() || '';
                    lines.forEach((line) => {
                        if (line.trim()) appendOutput(line);
                    });
                }
            } catch (error) {
                if (serialState.readLoopActive) {
                    appendOutput(`[ERROR] Read error: ${error.message}`);
                }
            } finally {
                if (serialState.reader) {
                    try { await serialState.reader.cancel(); } catch (_) {}
                    try { serialState.reader.releaseLock(); } catch (_) {}
                    serialState.reader = null;
                }
            }
        }

        async function disconnectSerial() {
            serialState.readLoopActive = false;

            if (serialState.reader) {
                try { await serialState.reader.cancel(); } catch (_) {}
                try { serialState.reader.releaseLock(); } catch (_) {}
                serialState.reader = null;
            }

            if (serialState.port) {
                try {
                    await serialState.port.close();
                    appendOutput('[INFO] Serial disconnected.');
                } catch (error) {
                    appendOutput(`[ERROR] Disconnect issue: ${error.message}`);
                }
            }

            updateStatus('Status: Disconnected');
        }

        async function sendSerialCommand(cmd) {
            if (!serialState.port || !serialState.port.writable) {
                appendOutput('[WARN] Connect to a serial port first.');
                return;
            }

            try {
                const encoder = new TextEncoder();
                const writer = serialState.port.writable.getWriter();
                await writer.write(encoder.encode(String(cmd)));
                writer.releaseLock();
                appendOutput(`[TX] ${cmd}`);
            } catch (error) {
                appendOutput(`[ERROR] Send failed: ${error.message}`);
            }
        }

        document.getElementById('selectPortBtn').addEventListener('click', selectPort);
        document.getElementById('connectSerialBtn').addEventListener('click', connectSerial);
        document.getElementById('disconnectSerialBtn').addEventListener('click', disconnectSerial);

        document.getElementById('sendCmd1Btn').addEventListener('click', () => sendSerialCommand('1'));
        document.getElementById('sendCmd2Btn').addEventListener('click', () => sendSerialCommand('2'));
        document.getElementById('sendCmd3Btn').addEventListener('click', () => sendSerialCommand('3'));
        document.getElementById('sendCmd4Btn').addEventListener('click', () => sendSerialCommand('4'));

        window.addEventListener('beforeunload', disconnectSerial);

        if (!('serial' in navigator)) {
            updateStatus('Web Serial not supported in this browser');
            appendOutput('[INFO] Use Chrome or Edge for serial monitor support.');
        } else {
            appendOutput('[INFO] Serial monitor ready. Baud default is 9600.');
        }
    </script>
</body>
</html>
